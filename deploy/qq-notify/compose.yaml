services:
  napcat:
    image: ${NAPCAT_IMAGE:-mlikiowa/napcat-docker:latest}
    restart: unless-stopped
    environment:
      MODE: ws
      WEBUI_TOKEN: ${NAPCAT_WEBUI_TOKEN:?Set NAPCAT_WEBUI_TOKEN in .env}
    ports:
      - "127.0.0.1:6099:6099"
    volumes:
      - ./data/qq:/app/.config/QQ
      - ./data/config:/app/napcat/config
      - ./data/plugins:/app/napcat/plugins

  notifier:
    profiles: [tools]
    build:
      context: ../..
      dockerfile: deploy/qq-notify/Dockerfile
    environment:
      QQ_GROUP_ID: ${QQ_GROUP_ID:?Set QQ_GROUP_ID in .env}
      ONEBOT_URL: http://napcat:3000
      ONEBOT_ACCESS_TOKEN: ${ONEBOT_ACCESS_TOKEN:?Set ONEBOT_ACCESS_TOKEN in .env}
      NOTIFY_STATE: /data/notified.json
      DEV_HISTORY_URL: ${DEV_HISTORY_URL:-https://api.github.com/repos/hithesis/hithesis/contents/dev-history.json?ref=gh-pages}
      DEV_PUBLISH_TOKEN: ${DEV_PUBLISH_TOKEN:-}
    volumes:
      - ./data/notifier:/data
