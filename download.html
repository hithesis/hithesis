<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="description" content="hi!Thesis 哈尔滨工业大学LaTeX学位论文模板，提供论文、开题与中期报告模板下载。">
<title>哈尔滨工业大学LaTeX学位论文模板 · hi!Thesis</title>
<link rel="icon" href="./assets/favicon.svg?v=2" type="image/svg+xml" sizes="any">
<link rel="icon" href="./assets/favicon-32.png?v=2" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="./assets/apple-touch-icon.png" sizes="180x180">
<script src="./theme.js?v=campus-26"></script>
<link rel="stylesheet" href="./style.css?v=campus-26">
</head>
<body data-page="download">
<a class="skip-link" href="#download-center">跳转到模板选择</a>
<div data-site-header></div>

<section class="hero" aria-labelledby="page-title">
  <div class="container hero-inner">
    <div class="hero-copy">
      <h1 id="page-title"><span>哈尔滨工业大学</span><span class="title-latex">LaTeX</span><span>学位论文模板</span></h1>
    </div>
    <div class="hero-links" data-community-links></div>
  </div>
</section>

<main class="container download-center" id="download-center">
  <section class="version-panel" aria-labelledby="version-heading">
    <div class="version-intro">
      <h2 id="version-heading">选择版本</h2>
    </div>
    <div class="version-content">
      <div class="opts version-options" data-group="version" role="radiogroup" aria-labelledby="version-heading">
        <label class="opt version-card"><input type="radio" name="version" value="stable" checked><span class="version-card-title">稳定版</span><small id="stable-label">最新正式版</small></label>
        <label class="opt version-card"><input type="radio" name="version" value="dev"><span class="version-card-title">开发版</span><small id="dev-label">读取构建信息中…</small></label>
      </div>
      <div class="version-actions">
        <details class="version-info" id="stable-info" data-menu>
          <summary>稳定版详情</summary>
          <div class="popup-surface version-popover">
            <div class="version-meta"><strong id="stable-version">最新正式版</strong><span id="stable-date" hidden></span></div>
            <div class="version-links">
              <a class="manual-link" id="stable-manual" href="https://mirrors.ctan.org/macros/xetex/latex/hithesis/hithesis.pdf" target="_blank" rel="noopener">用户手册（CTAN） ↗</a>
              <a id="stable-release" href="https://github.com/hithesis/hithesis/releases/latest" target="_blank" rel="noopener">发布说明 ↗</a>
              <a href="https://ctan.org/pkg/hithesis" target="_blank" rel="noopener">CTAN 项目页 ↗</a>
            </div>
          </div>
        </details>
        <details class="version-info" id="dev-info" data-menu>
          <summary>开发版详情</summary>
          <div class="popup-surface version-popover">
            <p id="version-status" aria-live="polite">正在读取开发版…</p>
            <div id="version-details" hidden>
              <div class="version-meta"><strong id="dev-version"></strong><span id="build-date"></span><a id="build-commit" target="_blank" rel="noopener"></a></div>
              <div class="version-links">
                <a class="manual-link" id="dev-manual" target="_blank" rel="noopener" hidden>最新用户手册（PDF） ↗</a>
                <span class="manual-status" id="dev-manual-status">正在读取用户手册…</span>
                <a id="build-report" target="_blank" rel="noopener">更新说明（PDF） ↗</a>
                <a href="./DEV_CHANGELOG.md" target="_blank" rel="noopener">更新记录 ↗</a>
                <a id="build-release" target="_blank" rel="noopener">本次发布 ↗</a>
                <a id="build-run" target="_blank" rel="noopener">构建记录 ↗</a>
              </div>
            </div>
          </div>
        </details>
      </div>
    </div>
  </section>

  <div class="download-layout">
    <section class="panel selector-panel" aria-labelledby="selector-heading" aria-describedby="selection-help">
      <div class="panel-heading">
        <h2 id="selector-heading">选择模板</h2>
        <button class="button-quiet clear-button" id="clear" type="button" title="清空当前选择" disabled><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10a8 8 0 1 1 1.8 7M3 4v6h6"/></svg>清空</button>
      </div>
      <p class="sr-only" id="selection-help">每组选项均可多选，点击选中或取消。</p>

      <div class="filter-row" role="group" aria-labelledby="language-heading">
        <div class="row-label"><h3 id="language-heading">语言</h3></div>
        <div class="opts" data-group="language">
          <label class="opt"><input type="checkbox" value="zh"><span>中文</span></label>
          <label class="opt"><input type="checkbox" value="en"><span>英文</span></label>
        </div>
      </div>

      <div class="filter-row" role="group" aria-labelledby="campus-heading">
        <div class="row-label"><h3 id="campus-heading">校区</h3></div>
        <div class="opts" data-group="campus">
          <label class="opt"><input type="checkbox" value="harbin"><span>哈尔滨</span></label>
          <label class="opt"><input type="checkbox" value="weihai"><span>威海</span></label>
          <label class="opt"><input type="checkbox" value="shenzhen"><span>深圳</span></label>
        </div>
      </div>

      <div class="filter-row" role="group" aria-labelledby="type-heading">
        <div class="row-label"><h3 id="type-heading">类型</h3></div>
        <div class="opts" data-group="type">
          <label class="opt"><input type="checkbox" value="doctor"><span>博士</span></label>
          <label class="opt"><input type="checkbox" value="master"><span>硕士</span></label>
          <label class="opt"><input type="checkbox" value="bachelor"><span>本科</span></label>
          <label class="opt"><input type="checkbox" value="postdoc"><span>博士后</span></label>
        </div>
      </div>

      <div class="filter-row" id="stage-panel" role="group" aria-labelledby="stage-heading">
        <div class="row-label"><h3 id="stage-heading">阶段</h3></div>
        <div class="opts" data-group="stage">
          <label class="opt"><input type="checkbox" value="opening"><span>开题</span></label>
          <label class="opt"><input type="checkbox" value="midterm"><span>中期</span></label>
          <label class="opt"><input type="checkbox" value="final"><span>终稿</span></label>
        </div>
      </div>
    </section>

    <aside class="panel preview" aria-labelledby="preview-heading">
      <div class="preview-heading"><h2 id="preview-heading">下载清单</h2><span class="count" id="count" aria-label="匹配模板数量">0</span></div>
      <p class="sr-only" id="selection-status" aria-live="polite">请选择模板。</p>
      <div class="preview-body">
        <p class="selection-summary" id="selection-summary" hidden></p>
        <div class="empty-state" id="empty-state"><p>请选择模板。</p></div>
        <button class="button-quiet list-trigger" id="list-open" type="button" data-dialog-open="list-dialog" aria-haspopup="dialog" hidden>查看完整清单 <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></button>
      </div>
      <div class="actions">
        <p class="action-summary" id="action-summary" aria-live="polite">已匹配 0 份模板 · 稳定版</p>
        <button class="button primary" id="download" type="button" disabled><span aria-hidden="true">↓</span> 下载选中 <span class="button-count" id="download-count">0</span></button>
        <button class="button secondary" id="download-all" type="button">下载全部</button>
      </div>
    </aside>
  </div>
</main>

<dialog class="popup-surface site-dialog download-dialog" id="list-dialog" aria-labelledby="list-heading" aria-describedby="list-summary">
  <div class="dialog-top">
    <div class="dialog-heading">
      <h2 id="list-heading">完整下载清单 <span class="dialog-count" id="list-count">0 份</span></h2>
      <button class="button-quiet icon-button" type="button" data-dialog-close aria-label="关闭下载清单"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="m6 6 12 12M6 18 18 6"/></svg></button>
    </div>
    <p class="dialog-note" id="list-summary"></p>
  </div>
  <div class="dialog-body" tabindex="0" role="region" aria-label="完整模板清单">
    <p class="dialog-note" id="list-empty" hidden>当前没有可下载的模板。</p>
    <ul class="download-list" id="list" aria-label="匹配的模板文件"></ul>
  </div>
  <div class="dialog-footer dialog-actions"><button class="button secondary" type="button" data-dialog-close>返回选择</button></div>
</dialog>

<div data-site-dialogs></div>
<script src="./site-shell.js?v=campus-26" defer></script>
<script src="./script.js?v=campus-26" defer></script>
<script src="./ui.js?v=campus-26" defer></script>
<script src="./contributors.js?v=campus-26" type="module"></script>
</body>
</html>
