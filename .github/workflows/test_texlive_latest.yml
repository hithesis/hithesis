name: texlive-latest

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: write   # required for tag + release

jobs:
  test-and-release:
    runs-on: ubuntu-latest

    steps:
    # ---------------------------
    # Checkout
    # ---------------------------
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0   # REQUIRED for tag detection

    # ---------------------------
    # Pull TeX Live Docker image
    # ---------------------------
    - name: Pull TeX Live (latest)
      run: docker pull texlive/texlive:latest

    # ---------------------------
    # Unpack the .dtx in place first: hithesis.ins writes the generated class
    # files into the examples/ subdirectories (which already exist here), and
    # `l3build ctan` then bundles those examples/ into the TDS doc tree.
    # ---------------------------
    - name: Generate class files for examples
      run: |
        docker run --rm -i \
          -v "$(pwd):/hithesis" \
          -w /hithesis \
          texlive/texlive:latest \
          make cls

    # ---------------------------
    # Build documentation + CTAN archive with l3build
    # (produces hithesis.pdf, hithesis-ctan.zip and hithesis.tds.zip)
    # ---------------------------
    - name: Build documentation and CTAN archive
      run: |
        docker run --rm -i \
          -v "$(pwd):/hithesis" \
          -w /hithesis \
          texlive/texlive:latest \
          l3build ctan

    # ---------------------------
    # Test Chinese thesis
    # ---------------------------
    - name: Test Chinese thesis
      run: |
        cd examples/hitbook/chinese
        docker run --rm -i \
          -v "$(pwd):/hithesis" \
          -w /hithesis \
          texlive/texlive:latest \
          make thesis

    # ---------------------------
    # Test English thesis
    # ---------------------------
    - name: Test English thesis
      run: |
        cd examples/hitbook/english
        docker run --rm -i \
          -v "$(pwd):/hithesis" \
          -w /hithesis \
          texlive/texlive:latest \
          make thesis

    # ---------------------------
    # Test reports
    # ---------------------------
    - name: Test reports
      run: |
        cd examples/hitart/reports
        docker run --rm -i \
          -v "$(pwd):/hithesis" \
          -w /hithesis \
          texlive/texlive:latest \
          make report

    # ---------------------------
    # Test reportplus
    # ---------------------------
    - name: Test reportplus
      run: |
        cd examples/hitart/reportplus
        docker run --rm -i \
          -v "$(pwd):/hithesis" \
          -w /hithesis \
          texlive/texlive:latest \
          make report

    # ============================================================
    # RELEASE LOGIC (only on push to master, not PRs)
    # ============================================================

    - name: Generate release notes from \\changes
      if: github.event_name == 'push'
      run: make changes

    - name: Extract changes version
      if: github.event_name == 'push'
      id: changes
      run: |
        echo "version=$(make version-changes)" >> $GITHUB_OUTPUT

    - name: Check if git tag already exists
      if: github.event_name == 'push'
      id: tagcheck
      run: |
        if git rev-parse "${{ steps.changes.outputs.version }}" >/dev/null 2>&1; then
          echo "exists=true" >> $GITHUB_OUTPUT
        else
          echo "exists=false" >> $GITHUB_OUTPUT
        fi

    - name: Package example templates
      if: github.event_name == 'push' && steps.tagcheck.outputs.exists == 'false'
      run: |
        bash make_release_pkg.sh "${{ steps.changes.outputs.version }}"

    - name: Create git tag
      if: github.event_name == 'push' && steps.tagcheck.outputs.exists == 'false'
      run: |
        git tag ${{ steps.changes.outputs.version }}
        git push origin ${{ steps.changes.outputs.version }}

    - name: Create GitHub Release
      if: github.event_name == 'push' && steps.tagcheck.outputs.exists == 'false'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.changes.outputs.version }}
        body_path: RELEASE_NOTES.md
        files: |
          dist/*.zip
          dist/*.md5
          dist/MD5SUMS
          hithesis-ctan.zip
          hithesis.tds.zip

    # ---------------------------
    # Upload the CTAN archive (hithesis-ctan.zip) to CTAN
    # Runs only when a new version is tagged, mirroring the release above.
    # CTAN_UPLOAD=true makes l3build upload without an interactive prompt;
    # CTAN still sends a confirmation email to the uploader in build.lua.
    # ---------------------------
    - name: Upload to CTAN
      if: github.event_name == 'push' && steps.tagcheck.outputs.exists == 'false'
      run: |
        version="${{ steps.changes.outputs.version }}"
        version="${version#v}"
        docker run --rm -i \
          -e CTAN_UPLOAD=true \
          -v "$(pwd):/hithesis" \
          -w /hithesis \
          texlive/texlive:latest \
          l3build upload "${version}"
