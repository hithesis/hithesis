name: Change compatibility policy

on:
  pull_request:
    branches: [dev, master]
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  compatibility-declaration:
    name: Compatibility declaration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check PR title, breaking-change explanation and migration
        run: python3 scripts/dev-version.py check-pr --event "$GITHUB_EVENT_PATH"
