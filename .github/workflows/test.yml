name: Test

on:
  push:
    branches: [master, dev]
  pull_request:
  workflow_dispatch:
  schedule:
    # 每天 02:00（UTC+8）跑全量变体和全量回归
    - cron: "0 18 * * *"

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # 封面日期取 \today，不钉死的话每天编出来的 PDF 都不一样，没法比
  SOURCE_DATE_EPOCH: "1700000000"
  FORCE_SOURCE_DATE: "1"

jobs:
  # ============================================================
  # \changes 日期约定检查。只跑 python，不用装 TeX，十几秒出结果。
  #    三条规则都是无状态的，不需要跟上一个提交比：
  #      开发版条目必须写 0000/00/00
  #      已发布版本不得留 0000/00/00
  #      日期格式必须 YYYY/MM/DD
  # ============================================================
  changes-check:
    name: changes 日期约定
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 scripts/changes.py --check

  # ============================================================
  # L1 编译矩阵，看六个 TeX Live 版本还能不能编出来
  # ============================================================
  texlive-matrix:
    name: TeX Live ${{ matrix.tl-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tl-version: [2021, 2022, 2023, 2024, 2025, 2026]

    env:
      # 2021-2025 从 historic 归档装。action 默认用 ftp.math.utah.edu，该站点
      # 当前无法访问，包下载全部失败而 tlmgr 仍以 0 退出，安装步骤看不出问题，
      # 后面用到缺失的包时才报错。tu-chemnitz 的归档五个版本都验证过可访问。
      # 2026 是当前版本，走常规 CTAN 仓库；发布新版本时这里要跟矩阵一起改。
      TL_REPO: ${{ matrix.tl-version == 2026
        && 'https://mirror.ctan.org/systems/texlive/tlnet'
        || format('https://ftp.tu-chemnitz.de/pub/tug/historic/systems/texlive/{0}/tlnet-final', matrix.tl-version) }}

    steps:
      - uses: actions/checkout@v7

      - uses: TeX-Live/setup-texlive-action@v4
        with:
          version: ${{ matrix.tl-version }}
          repository: ${{ env.TL_REPO }}
          package-file: |
            .github/tl_packages
            ${{ matrix.tl-version < 2024 && '.github/tl_packages_compat' || '' }}

      - name: Install ghostscript
        # examples 里的 .eps 插图要经 epstopdf 转一道，得有 gs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ghostscript

      # 缓存可能是换镜像之前建的，里面缺 l3build，而且缓存命中时不会重新安装。
      # 恢复出来的 TeX Live 里 tlmgr 的仓库配置也还指向旧的站点，所以补装时要
      # 先把仓库改过来。
      #
      # 装不上就失败，不跳过。跳过之后 CI 显示为通过，一旦长期装不上，我们会
      # 以为六个版本都在跑宏级测试，而这个测试正是为了发现只在个别版本上出现
      # 的问题才加的。
      - name: Ensure l3build is available
        run: |
          if command -v l3build >/dev/null; then
            echo "l3build 已就位：$(command -v l3build)"
            exit 0
          fi
          echo "缓存里没有 l3build，补装"
          tlmgr option repository "$TL_REPO"
          tlmgr install l3build
          command -v l3build

      - name: Generate cls files
        run: make cls

      # 宏级回归：比对 .lvt 编出的日志与 testfiles/*.tlg 基线。
      # 六个版本都跑。基线里只有本模板自己的宏定义，不含内核版本信息或文件日期，
      # 涉及内核的只有 \DeclareRobustCommand 与 \newcommand 可选参数两处展开结果，
      # 2021 到 2026 没有变化。跨版本运行是必要的：gbt7714 在 TL2026 改用
      # \ProcessKeyOptions 后模板无法编译，就属于只在个别版本出现的宏级差异。
      - name: Run macro-level checks
        run: l3build check

      - name: Upload check diffs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: l3build-check-diffs-tl${{ matrix.tl-version }}
          path: build/test/*.diff
          retention-days: 7

      - name: Build package documentation
        run: make doc

      - name: Build Chinese thesis
        run: make -C examples/hitbook/chinese thesis

      - name: Build English thesis
        run: make -C examples/hitbook/english thesis

      - name: Build report
        run: make -C examples/hitart/reports report

      - name: Build reportplus
        run: make -C examples/hitart/reportplus report

  # ============================================================
  # 跨平台编译：模板本身在 macOS / Windows 上还编不编得出来。
  #    只跑 TL latest，不铺六个版本。版本维度由上面的矩阵覆盖，
  #    这里要覆盖的是平台维度（字体查找、gs 调用、路径处理）。
  #    用 latexmk 而不是 make：latexmk 随 TeX Live 走，三平台都有。
  # ============================================================
  cross-platform:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7

      - uses: TeX-Live/setup-texlive-action@v4
        with:
          version: latest
          package-file: .github/tl_packages

      # 先探测再装。runner 镜像里可能已经有 gs，跳过 brew 也就没有它那条
      # 关于镜像自带的 aws/tap 未受信任的警告，那条警告与本项目无关。
      - name: Install ghostscript (macOS)
        if: runner.os == 'macOS'
        run: |
          if command -v gs >/dev/null; then
            echo "已有 gs：$(command -v gs)"
            gs -version | head -1
          else
            brew install ghostscript
          fi

      # 不运行安装程序，直接解包。
      #
      # 这一步换过三种装法都不行：chocolatey 的 ghostscript 包依赖 AutoHotkey
      # 操作图形安装程序，会卡住十五分钟以上；官方安装程序带 /S 静默参数，但在
      # runner 上同样不返回，日志停在开始安装那一行。两者卡的是同一个安装程序。
      #
      # 它是 NSIS 打的包，7z 可以直接解开，得到的 bin/ 与 lib/、Resource/ 平级，
      # 正是 gswin64c.exe 运行时期望的布局。7z 是 windows runner 自带的。
      - name: Install ghostscript (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 10
        run: |
          if (Get-Command gswin64c -ErrorAction SilentlyContinue) {
            Write-Host "已有 gswin64c，跳过"
            exit 0
          }
          # 版本钉死，不取 latest：资产命名或打包方式一变，这一步就会失败。
          # 升级时改这一行即可，发行版列表见
          # https://github.com/ArtifexSoftware/ghostpdl-downloads/releases
          $url = 'https://github.com/ArtifexSoftware/ghostpdl-downloads/releases/download/gs10071/gs10071w64.exe'
          Write-Host "下载 $url"
          # Invoke-WebRequest 默认渲染进度条，在非交互环境下会把下载拖慢几十倍，
          # 实测 62 MB 十分钟下不完，所以用 runner 自带的 curl.exe。
          curl.exe -sSL --retry 3 --retry-delay 5 -o gs-setup.exe $url
          if ($LASTEXITCODE -ne 0) { Write-Error "下载失败"; exit 1 }

          Write-Host "解包 $((Get-Item gs-setup.exe).Length / 1MB -as [int]) MB"
          7z x gs-setup.exe -oC:\gs -y | Out-Null
          if ($LASTEXITCODE -ne 0) { Write-Error "解包失败"; exit 1 }

          $bin = 'C:\gs\bin'
          if (-not (Test-Path "$bin\gswin64c.exe")) {
            Write-Host "解包后没有 $bin\gswin64c.exe。C:\gs 的内容："
            Get-ChildItem C:\gs | ForEach-Object { Write-Host "  $($_.Name)" }
            exit 1
          }
          # 确认能跑起来：安装程序还会装 VC++ 运行库，解包跳过了那一步，
          # 缺运行库的话这里会直接报错，而不是等 epstopdf 用到时才失败。
          & "$bin\gswin64c.exe" -version
          if ($LASTEXITCODE -ne 0) { Write-Error "gswin64c 无法运行"; exit 1 }
          $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # 这里用 l3build：它随 TeX Live 发行，三个平台都能直接跑，不必处理
      # TEXINPUTS 的分隔符差异，也不要求 runner 上装了 make。
      #
      # 用 distribute 而不是 install。装进 TEXMFHOME 后只有 .cls 能被找到，
      # .eps 用 kpathsea 的图形检索格式、.bst 用 BSTINPUTS，都不在 tex/latex
      # 路径下。示例需要生成物就放在示例目录里，与用户解压发布包后的目录结构
      # 一致，这样跨平台任务与 Linux 矩阵验证的是同一种用法。
      - name: Generate and distribute class files
        shell: bash
        run: |
          # setup 漏装 l3build 时给一条明确提示，避免只看到 command not found
          command -v l3build || { echo "setup 没装上 l3build"; exit 1; }
          l3build unpack
          l3build distribute

      - name: Build Chinese thesis
        working-directory: examples/hitbook/chinese
        run: latexmk -xelatex -interaction=nonstopmode thesis.tex

      - name: Build English thesis
        working-directory: examples/hitbook/english
        run: latexmk -xelatex -interaction=nonstopmode thesis.tex

      - name: Build report
        working-directory: examples/hitart/reports
        run: latexmk -xelatex -interaction=nonstopmode report.tex

      - name: Build reportplus
        working-directory: examples/hitart/reportplus
        run: latexmk -xelatex -interaction=nonstopmode report.tex

  # ============================================================
  # L2 变体矩阵，看 42 种 \documentclass 选项组合还能不能编出来。
  #    全量跑，实测三分钟左右，没必要再分快慢集。
  # ============================================================
  variants:
    name: 变体矩阵
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: TeX-Live/setup-texlive-action@v4
        with:
          version: latest
          package-file: .github/tl_packages

      - name: Install ghostscript
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ghostscript

      - name: Generate cls files
        run: make cls

      - name: Select variants
        run: |
          ls tests/variants/*.conf | xargs -n1 basename | sed 's/\.conf$//' > /tmp/variants.txt
          echo "共 $(wc -l < /tmp/variants.txt) 个变体：" >> "$GITHUB_STEP_SUMMARY"
          sed 's/^/- /' /tmp/variants.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Compile variants
        run: |
          mkdir -p tests/work
          # 只看能不能编过，不渲染 PNG
          export RENDER_PNG=0
          xargs -P "$(nproc)" -I{} bash -c '
            v="{}"
            if bash tools/compile-variant.sh "$v" > "tests/work/$v.log" 2>&1; then
              printf "  %-44s OK\n" "$v"
            else
              printf "  %-44s FAIL\n" "$v"
              echo "$v" >> /tmp/failed.txt
            fi
          ' < /tmp/variants.txt

          if [[ -s /tmp/failed.txt ]]; then
            {
              echo
              echo "### 编译失败的变体"
              sed 's/^/- /' /tmp/failed.txt
            } >> "$GITHUB_STEP_SUMMARY"
            echo "以下变体编译失败："
            while read -r v; do
              echo "::group::$v"
              tail -60 "tests/work/$v.log"
              echo "::endgroup::"
            done < /tmp/failed.txt
            exit 1
          fi

      - name: Upload compile logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: variant-logs
          path: tests/work/*.log
          retention-days: 7

  # ============================================================
  # L3 排版回归，跟上一个正式 release 逐页比。
  #    默认只出报告和差异 artifact，不阻断合并。要卡的话给 PR 打
  #    regression-must-match 标签。
  # ============================================================
  regression:
    name: 排版回归
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: TeX-Live/setup-texlive-action@v4
        with:
          version: latest
          package-file: .github/tl_packages

      - name: Install ghostscript and imagemagick
        # ghostscript 渲染 PNG，imagemagick 的 compare 生成逐页差异图。
        # 不用 diff-pdf：它不在 Ubuntu 源里，只能本地 brew 装，CI 里装不上。
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ghostscript imagemagick

      - name: Generate cls files
        run: make cls

      - name: Run regression test
        id: regression
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # 参照上一个发布版，比的是“相对用户手上那一版改了什么”。
          # 模块化重构期间这里曾特判 modularity 分支去比 dev；重构已并入 dev，
          # 再留着就是拿 dev 跟自己比，永远零差异，等于没测。
          set +e
          python3 scripts/regression_test.py --ci
          rc=$?
          set -e

          case "$rc" in
            0) echo "排版跟参照版本一样。" ;;
            1) echo "diff=1" >> "$GITHUB_OUTPUT" ;;
            3) echo "没找到能当参照的 release，跳过。" ;;
            *) exit "$rc" ;;   # 编译失败之类，照常算失败
          esac

      - name: Upload diff artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: regression-diff
          path: target/regression/report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Fail if labelled regression-must-match
        if: steps.regression.outputs.diff == '1' && contains(github.event.pull_request.labels.*.name, 'regression-must-match')
        run: |
          echo "PR 打了 regression-must-match 标签，排版有差异就算失败。"
          exit 1

  # ============================================================
  # 兜底跑一遍完整 TeX Live，多数用户装的就是这个。
  #    只在 push 和 nightly 上跑，PR 上省掉 5 GB 镜像的拉取时间。
  #    它跟 texlive-matrix 的 latest 条目结果对不上，一般是
  #    .github/tl_packages 少写了包。
  # ============================================================
  docker-full:
    name: Docker texlive:latest
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Pull TeX Live (latest)
        run: docker pull texlive/texlive:latest

      - name: Build documentation and examples
        run: |
          docker run --rm -i -v "$(pwd):/hithesis" -w /hithesis \
            -e SOURCE_DATE_EPOCH -e FORCE_SOURCE_DATE \
            texlive/texlive:latest bash -c '
              set -e
              make all
              make -C examples/hitbook/chinese thesis
              make -C examples/hitbook/english thesis
              make -C examples/hitart/reports report
              make -C examples/hitart/reportplus report
            '
