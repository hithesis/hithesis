name: Test

on:
  push:
    branches: [master, dev, modularity]
  pull_request:
  workflow_dispatch:
  schedule:
    # 每天 02:00（UTC+8）跑全量变体和全量回归
    - cron: "0 18 * * *"

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # 封面日期取 \today，不钉死的话每天编出来的 PDF 都不一样，没法比
  SOURCE_DATE_EPOCH: "1700000000"
  FORCE_SOURCE_DATE: "1"

jobs:
  # ============================================================
  # \changes 日期约定检查。只跑 python，不用装 TeX，十几秒出结果。
  #    三条规则都是无状态的，不需要跟上一个提交比：
  #      开发版条目必须写 0000/00/00
  #      已发布版本不得留 0000/00/00
  #      日期格式必须 YYYY/MM/DD
  # ============================================================
  changes-check:
    name: changes 日期约定
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 scripts/changes.py --check

  # ============================================================
  # L1 编译矩阵，看六个 TeX Live 版本还能不能编出来
  # ============================================================
  texlive-matrix:
    name: TeX Live ${{ matrix.tl-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tl-version: [2021, 2022, 2023, 2024, 2025, 2026]

    steps:
      - uses: actions/checkout@v7

      - uses: TeX-Live/setup-texlive-action@v4
        with:
          version: ${{ matrix.tl-version }}
          package-file: |
            .github/tl_packages
            ${{ matrix.tl-version < 2024 && '.github/tl_packages_compat' || '' }}

      - name: Install ghostscript
        # examples 里的 .eps 插图要经 epstopdf 转一道，得有 gs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ghostscript

      - name: Generate cls files
        run: make cls

      # 宏级回归：比对 .lvt 跑出来的日志与 testfiles/*.tlg 基线。
      # 六个版本都跑。基线里只有本模板自己的宏定义，不含内核版本横幅或文件日期，
      # 沾内核的只有 \DeclareRobustCommand 与 \newcommand 可选参数这两套展开式，
      # 2021 到 2026 都没变过。跨版本跑才有意义：gbt7714 在 TL2026 改用
      # \ProcessKeyOptions 把模板打挂，就是这一类只在某个版本上现形的宏级漂移。
      - name: Run macro-level checks
        run: l3build check

      - name: Upload check diffs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: l3build-check-diffs-tl${{ matrix.tl-version }}
          path: build/test/*.diff
          retention-days: 7

      - name: Build package documentation
        run: make doc

      - name: Build Chinese thesis
        run: make -C examples/hitbook/chinese thesis

      - name: Build English thesis
        run: make -C examples/hitbook/english thesis

      - name: Build report
        run: make -C examples/hitart/reports report

      - name: Build reportplus
        run: make -C examples/hitart/reportplus report

  # ============================================================
  # 跨平台编译：模板本身在 macOS / Windows 上还编不编得出来。
  #    只跑 TL latest，不铺六个版本——版本维度由上面的矩阵覆盖，
  #    这里要覆盖的是平台维度（字体查找、gs 调用、路径处理）。
  #    用 latexmk 而不是 make：latexmk 随 TeX Live 走，三平台都有。
  # ============================================================
  cross-platform:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7

      - uses: TeX-Live/setup-texlive-action@v4
        with:
          version: latest
          package-file: .github/tl_packages

      - name: Install ghostscript (macOS)
        if: runner.os == 'macOS'
        run: brew install ghostscript

      - name: Install ghostscript (Windows)
        if: runner.os == 'Windows'
        run: choco install ghostscript --no-progress -y

      # 用 l3build 而不是直接跑 docstrip：它自带跨平台的路径处理，
      # 装进 TEXMFHOME 之后示例目录按 kpathsea 的常规查找就能拿到类文件，
      # 不用把生成物拷进每个示例目录，也不用管 TEXINPUTS 在三个平台上的写法差异。
      - name: Generate and install class files
        run: l3build install

      - name: Build Chinese thesis
        working-directory: examples/hitbook/chinese
        run: latexmk -xelatex -interaction=nonstopmode thesis.tex

      - name: Build English thesis
        working-directory: examples/hitbook/english
        run: latexmk -xelatex -interaction=nonstopmode thesis.tex

      - name: Build report
        working-directory: examples/hitart/reports
        run: latexmk -xelatex -interaction=nonstopmode report.tex

      - name: Build reportplus
        working-directory: examples/hitart/reportplus
        run: latexmk -xelatex -interaction=nonstopmode report.tex

  # ============================================================
  # L2 变体矩阵，看 42 种 \documentclass 选项组合还能不能编出来。
  #    全量跑，实测三分钟左右，没必要再分快慢集。
  # ============================================================
  variants:
    name: 变体矩阵
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: TeX-Live/setup-texlive-action@v4
        with:
          version: latest
          package-file: .github/tl_packages

      - name: Install ghostscript
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ghostscript

      - name: Generate cls files
        run: make cls

      - name: Select variants
        run: |
          ls tests/variants/*.conf | xargs -n1 basename | sed 's/\.conf$//' > /tmp/variants.txt
          echo "共 $(wc -l < /tmp/variants.txt) 个变体：" >> "$GITHUB_STEP_SUMMARY"
          sed 's/^/- /' /tmp/variants.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Compile variants
        run: |
          mkdir -p tests/work
          # 只看能不能编过，不渲染 PNG
          export RENDER_PNG=0
          xargs -P "$(nproc)" -I{} bash -c '
            v="{}"
            if bash tools/compile-variant.sh "$v" > "tests/work/$v.log" 2>&1; then
              printf "  %-44s OK\n" "$v"
            else
              printf "  %-44s FAIL\n" "$v"
              echo "$v" >> /tmp/failed.txt
            fi
          ' < /tmp/variants.txt

          if [[ -s /tmp/failed.txt ]]; then
            {
              echo
              echo "### 编译失败的变体"
              sed 's/^/- /' /tmp/failed.txt
            } >> "$GITHUB_STEP_SUMMARY"
            echo "以下变体编译失败："
            while read -r v; do
              echo "::group::$v"
              tail -60 "tests/work/$v.log"
              echo "::endgroup::"
            done < /tmp/failed.txt
            exit 1
          fi

      - name: Upload compile logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: variant-logs
          path: tests/work/*.log
          retention-days: 7

  # ============================================================
  # L3 排版回归，跟上一个正式 release 逐页比。
  #    默认只出报告和差异 artifact，不阻断合并。要卡的话给 PR 打
  #    regression-must-match 标签。
  # ============================================================
  regression:
    name: 排版回归
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: TeX-Live/setup-texlive-action@v4
        with:
          version: latest
          package-file: .github/tl_packages

      - name: Install ghostscript and imagemagick
        # ghostscript 渲染 PNG，imagemagick 的 compare 生成逐页差异图。
        # 不用 diff-pdf：它不在 Ubuntu 源里，只能本地 brew 装，CI 里装不上。
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ghostscript imagemagick

      - name: Generate cls files
        run: make cls

      - name: Run regression test
        id: regression
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          args=(--ci)

          # modularity 是纯重构分支，参照物取 dev：两边功能提交相同，
          # 唯一差别就是重构本身，所以正确结果是零差异。
          # 其它分支比的是“相对上一个发布版改了什么”，用默认的 release。
          if [[ "${{ github.ref_name }}" == "modularity" ]]; then
            args+=(--against dev)
          fi

          set +e
          python3 scripts/regression_test.py "${args[@]}"
          rc=$?
          set -e

          case "$rc" in
            0) echo "排版跟参照版本一样。" ;;
            1) echo "diff=1" >> "$GITHUB_OUTPUT" ;;
            3) echo "没找到能当参照的 release，跳过。" ;;
            *) exit "$rc" ;;   # 编译失败之类，照常算失败
          esac

      - name: Upload diff artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: regression-diff
          path: target/regression/report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Fail on layout drift in refactor branch
        if: steps.regression.outputs.diff == '1' && github.ref_name == 'modularity'
        run: |
          echo "modularity 是纯重构分支，相对 dev 应当零差异。出现差异说明重构改到了版面。"
          exit 1

      - name: Fail if labelled regression-must-match
        if: steps.regression.outputs.diff == '1' && contains(github.event.pull_request.labels.*.name, 'regression-must-match')
        run: |
          echo "PR 打了 regression-must-match 标签，排版有差异就算失败。"
          exit 1

  # ============================================================
  # 兜底跑一遍完整 TeX Live，多数用户装的就是这个。
  #    只在 push 和 nightly 上跑，PR 上省掉 5 GB 镜像的拉取时间。
  #    它跟 texlive-matrix 的 latest 条目结果对不上，一般是
  #    .github/tl_packages 少写了包。
  # ============================================================
  docker-full:
    name: Docker texlive:latest
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Pull TeX Live (latest)
        run: docker pull texlive/texlive:latest

      - name: Build documentation and examples
        run: |
          docker run --rm -i -v "$(pwd):/hithesis" -w /hithesis \
            -e SOURCE_DATE_EPOCH -e FORCE_SOURCE_DATE \
            texlive/texlive:latest bash -c '
              set -e
              make all
              make -C examples/hitbook/chinese thesis
              make -C examples/hitbook/english thesis
              make -C examples/hitart/reports report
              make -C examples/hitart/reportplus report
            '
