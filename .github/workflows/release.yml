name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write # 打 tag、建 release 用

env:
  SOURCE_DATE_EPOCH: "1700000000"
  FORCE_SOURCE_DATE: "1"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # 查 tag 在不在，得有完整历史

      - uses: TeX-Live/setup-texlive-action@v4
        with:
          version: latest
          package-file: .github/tl_packages

      - name: Install ghostscript
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ghostscript

      - name: Generate release notes from \changes
        run: make changes

      - name: Extract changes version
        id: changes
        run: echo "version=$(make version-changes)" >> "$GITHUB_OUTPUT"

      - name: Check if git tag already exists
        id: tagcheck
        run: |
          if git rev-parse "${{ steps.changes.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # ---- 下面几步只在这个版本号还没发过时才走 ----

      # 必须在打 tag 之前：仓库约定是同一版本的所有 \changes 共用该版本的发布日期
      # （v3.1d 的 59 条全是 2025/03/03），先回写再打 tag，tag 上的源码日期才是准的。
      - name: Stamp \changes dates
        if: steps.tagcheck.outputs.exists == 'false'
        run: |
          python3 scripts/changes.py --stamp --date "$(date -u +%Y/%m/%d)"
          if ! git diff --quiet -- '*.dtx'; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "填写 ${{ steps.changes.outputs.version }} 的 changes 日期 [skip ci]" -- '*.dtx'
            git push origin HEAD:master
          fi

      - name: Regenerate release notes after stamping
        if: steps.tagcheck.outputs.exists == 'false'
        run: make changes

      - name: Build template package
        if: steps.tagcheck.outputs.exists == 'false'
        # 给用户的模板包。注意必须排在 Stamp 之后：包里的 hithesis.pdf 是手册，
        # 手册的「修改记录」一节会印出 \changes 的日期，先打包就会印成 0000/00/00。
        run: |
          scripts/package.sh \
            --version "${{ steps.changes.outputs.version }}" \
            --output "dist/hithesis-${{ steps.changes.outputs.version }}.zip"
          ls -lh dist/

      - name: Create git tag
        if: steps.tagcheck.outputs.exists == 'false'
        run: |
          git tag "${{ steps.changes.outputs.version }}"
          git push origin "${{ steps.changes.outputs.version }}"

      - name: Create GitHub Release
        if: steps.tagcheck.outputs.exists == 'false'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.changes.outputs.version }}
          body_path: RELEASE_NOTES.md
          files: dist/*.zip
