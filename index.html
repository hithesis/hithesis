<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>hithesis 模板下载</title>
<link rel="stylesheet" href="./style.css?v=dev-downloads-1">
</head>
<body>
<div class="wrap">
  <header>
    <h1><a href="https://github.com/hithesis/hithesis" target="_blank" rel="noopener">hithesis</a>模板下载</h1>
    <p>哈尔滨工业大学学位论文 / 报告 LaTeX 模板。勾选下面的选项组合出需要的模板，再点下载。
       选择版本和模板类型后下载，解压即可使用。</p>
  </header>

  <section class="panel" aria-labelledby="version-heading">
    <h2 id="version-heading">版本</h2>
    <div class="opts" data-group="version">
      <label class="opt"><input type="radio" name="version" value="stable" checked>稳定版 <small id="stable-label">最新正式版</small></label>
      <label class="opt"><input type="radio" name="version" value="dev">开发版 <small id="dev-label">读取构建信息中…</small></label>
    </div>
    <div class="version-info" aria-live="polite">
      <p id="version-status">稳定版来自最新正式发布。</p>
      <p id="version-details" hidden>
        <span id="build-date"></span>
        <a id="build-commit" target="_blank" rel="noopener"></a>
        <a id="build-run" target="_blank" rel="noopener">构建记录</a>
        <a id="build-release" target="_blank" rel="noopener">本次发布</a>
        <a id="build-report" target="_blank" rel="noopener">更新说明（PDF）</a>
        <a href="./DEV_CHANGELOG.md" target="_blank" rel="noopener">开发版更新记录</a>
      </p>
    </div>
  </section>

  <section class="panel">
    <h2>文档类型</h2>
    <div class="opts" data-group="family">
      <label class="opt"><input type="checkbox" value="chinese">中文论文</label>
      <label class="opt"><input type="checkbox" value="english">英文论文</label>
      <label class="opt"><input type="checkbox" value="reports">报告（开题 / 中期）</label>
      <label class="opt"><input type="checkbox" value="reportplus">报告加强版 <small>（仅深圳博士中期）</small></label>
    </div>
  </section>

  <section class="panel">
    <h2>校区 <small>campus</small></h2>
    <div class="opts" data-group="campus">
      <label class="opt"><input type="checkbox" value="shenzhen">深圳</label>
      <label class="opt"><input type="checkbox" value="weihai">威海</label>
      <label class="opt"><input type="checkbox" value="harbin">哈尔滨</label>
    </div>
  </section>

  <section class="panel">
    <h2>类型 <small>type</small></h2>
    <div class="opts" data-group="type">
      <label class="opt"><input type="checkbox" value="doctor">博士</label>
      <label class="opt"><input type="checkbox" value="master">硕士</label>
      <label class="opt"><input type="checkbox" value="bachelor">本科</label>
      <label class="opt"><input type="checkbox" value="postdoc">博士后 <small>（仅中 / 英论文）</small></label>
    </div>
  </section>

  <section class="panel">
    <h2>阶段 <small>stage（仅报告）</small></h2>
    <div class="opts" data-group="stage">
      <label class="opt"><input type="checkbox" value="opening">开题</label>
      <label class="opt"><input type="checkbox" value="midterm">中期</label>
    </div>
  </section>

  <div class="actions">
    <button class="primary" id="download">下载选中</button>
    <button id="download-all">下载全部（单个 zip）</button>
    <button class="ghost" id="clear">清空</button>
  </div>

  <section class="preview">
    <h2>将下载 <span class="count" id="count">0</span> 个模板</h2>
    <ul id="list"></ul>
  </section>

  <footer>
    <a href="https://dustincys.github.io/cn/2025/03/jobad/" target="_blank" rel="noopener">
      <img src="https://img.shields.io/badge/广告：初砚硕课题组招生-进行中-green" alt="招生">
    </a>
  </footer>
</div>

<script src="./script.js?v=dev-downloads-1" defer></script>
</body>
</html>
