<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>hithesis 模板下载</title>
<style>
  :root {
    --bg: #f6f7f9;
    --card: #ffffff;
    --border: #e3e6ea;
    --text: #24292f;
    --muted: #6e7781;
    --accent: #1f6feb;
    --accent-dark: #0a4fbe;
    --chip: #eef4ff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
  }
  .wrap { max-width: 860px; margin: 0 auto; padding: 32px 20px 64px; }
  header h1 { margin: 0 0 8px; font-size: 28px; }
  header p { margin: 0 0 24px; color: var(--muted); }
  header code {
    background: var(--chip); padding: 2px 6px; border-radius: 4px;
    font-size: 13px;
  }
  .panel {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 10px; padding: 18px 20px; margin-bottom: 16px;
  }
  .panel h2 { margin: 0 0 12px; font-size: 16px; }
  .panel h2 small { color: var(--muted); font-weight: normal; font-size: 13px; }
  .opts { display: flex; flex-wrap: wrap; gap: 10px; }
  label.opt {
    display: inline-flex; align-items: center; gap: 8px;
    border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 14px; cursor: pointer; user-select: none;
    background: #fff; transition: all .15s;
  }
  label.opt:hover { border-color: var(--accent); }
  label.opt input { accent-color: var(--accent); width: 16px; height: 16px; }
  label.opt.checked { background: var(--chip); border-color: var(--accent); }
  label.opt small { color: var(--muted); }
  .actions { display: flex; flex-wrap: wrap; gap: 12px; margin: 8px 0 20px; }
  button {
    border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 18px; font-size: 15px; cursor: pointer;
    background: #fff; color: var(--text); transition: all .15s;
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover { background: var(--accent-dark); }
  button.ghost:hover { border-color: var(--accent); color: var(--accent); }
  .preview { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 18px 20px; }
  .preview h2 { margin: 0 0 12px; font-size: 16px; }
  .preview .count { color: var(--accent); font-weight: 600; }
  .preview ul { list-style: none; margin: 0; padding: 0; columns: 2; column-gap: 24px; }
  .preview li {
    padding: 4px 0; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 13px; color: #444;
  }
  .preview li::before { content: "▸ "; color: var(--accent); }
  footer { margin-top: 28px; color: var(--muted); font-size: 13px; }
  footer a { color: var(--accent); text-decoration: none; }
  @media (max-width: 640px) { .preview ul { columns: 1; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>hithesis 模板下载</h1>
    <p>哈尔滨工业大学学位论文 / 报告 LaTeX 模板。勾选下面的选项组合出需要的模板，再点下载。
       链接固定指向 <code>releases/latest</code>，每次发新版本自动更新。</p>
  </header>

  <section class="panel">
    <h2>文档类型</h2>
    <div class="opts" data-group="family">
      <label class="opt"><input type="checkbox" value="chinese">中文论文</label>
      <label class="opt"><input type="checkbox" value="english">英文论文</label>
      <label class="opt"><input type="checkbox" value="reports">报告（开题 / 中期）</label>
      <label class="opt"><input type="checkbox" value="reportplus">报告加强版 <small>（仅深圳博士中期）</small></label>
    </div>
  </section>

  <section class="panel">
    <h2>校区 <small>campus</small></h2>
    <div class="opts" data-group="campus">
      <label class="opt"><input type="checkbox" value="shenzhen">深圳</label>
      <label class="opt"><input type="checkbox" value="weihai">威海</label>
      <label class="opt"><input type="checkbox" value="harbin">哈尔滨</label>
    </div>
  </section>

  <section class="panel">
    <h2>类型 <small>type</small></h2>
    <div class="opts" data-group="type">
      <label class="opt"><input type="checkbox" value="doctor">博士</label>
      <label class="opt"><input type="checkbox" value="master">硕士</label>
      <label class="opt"><input type="checkbox" value="bachelor">本科</label>
      <label class="opt"><input type="checkbox" value="postdoc">博士后 <small>（仅中 / 英论文）</small></label>
    </div>
  </section>

  <section class="panel">
    <h2>阶段 <small>stage（仅报告）</small></h2>
    <div class="opts" data-group="stage">
      <label class="opt"><input type="checkbox" value="opening">开题</label>
      <label class="opt"><input type="checkbox" value="midterm">中期</label>
    </div>
  </section>

  <div class="actions">
    <button class="primary" id="download">下载选中</button>
    <button id="download-all">下载全部（单个 zip）</button>
    <button class="ghost" id="clear">清空</button>
  </div>

  <section class="preview">
    <h2>将下载 <span class="count" id="count">0</span> 个模板</h2>
    <ul id="list"></ul>
  </section>

  <footer>
    校验：<a href="https://github.com/hithesis/hithesis/releases/latest/download/MD5SUMS" target="_blank" rel="noopener">MD5SUMS</a>
    &nbsp;·&nbsp;源码：<a href="https://github.com/hithesis/hithesis" target="_blank" rel="noopener">github.com/hithesis/hithesis</a>
  </footer>
</div>

<script>
  const BASE = "https://github.com/hithesis/hithesis/releases/latest/download/";

  // Which types each family accepts; reportplus is fixed (single template).
  const FAMILY = {
    chinese:    { types: ["doctor", "master", "bachelor", "postdoc"], stage: false },
    english:    { types: ["doctor", "master", "bachelor", "postdoc"], stage: false },
    reports:    { types: ["doctor", "master", "bachelor"],            stage: true  },
    reportplus: null,
  };

  function selected(group) {
    return Array.from(document.querySelectorAll(
      `[data-group="${group}"] input:checked`
    )).map((i) => i.value);
  }

  // Cartesian product of the checked groups, filtered to valid templates
  // (mirrors the packaging script in make_release_pkg.sh).
  function compute() {
    const families = selected("family");
    const campuses = selected("campus");
    const types    = selected("type");
    const stages   = selected("stage");
    const names = new Set();

    for (const f of families) {
      if (f === "reportplus") {
        names.add("reportplus-shenzhen-doctor-midterm");
        continue;
      }
      const info = FAMILY[f];
      for (const c of campuses) {
        for (const t of types) {
          if (!info.types.includes(t)) continue;
          if (info.stage) {
            for (const s of stages) {
              // hithesisart does not support doctor+midterm+shenzhen.
              if (t === "doctor" && s === "midterm" && c === "shenzhen") continue;
              names.add(`reports-${c}-${t}-${s}`);
            }
          } else {
            names.add(`${f}-${c}-${t}`);
          }
        }
      }
    }
    return Array.from(names).sort();
  }

  function render() {
    const names = compute();
    document.getElementById("count").textContent = names.length;
    document.getElementById("list").innerHTML =
      names.map((n) => `<li>${n}.zip</li>`).join("");
    // Highlight the checked state on each label.
    document.querySelectorAll("label.opt").forEach((l) => {
      l.classList.toggle("checked", l.querySelector("input").checked);
    });
  }

  function downloadOne(name) {
    const a = document.createElement("a");
    a.href = BASE + name + ".zip";
    a.download = name + ".zip";
    document.body.appendChild(a);
    a.click();
    a.remove();
  }

  function downloadSelected() {
    const names = compute();
    if (!names.length) { alert("请先勾选需要的模板。"); return; }
    let i = 0;
    (function next() {
      if (i >= names.length) return;
      downloadOne(names[i++]);
      setTimeout(next, 400);
    })();
  }

  document.getElementById("download").addEventListener("click", downloadSelected);
  document.getElementById("download-all").addEventListener("click", () =>
    downloadOne("hithesis-examples"));
  document.getElementById("clear").addEventListener("click", () => {
    document.querySelectorAll("input[type=checkbox]").forEach((i) => (i.checked = false));
    render();
  });
  document.querySelectorAll("input[type=checkbox]").forEach((i) =>
    i.addEventListener("change", render));

  render();
</script>
</body>
</html>
