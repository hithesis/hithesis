<header class="site-header">
  <div class="container masthead">
    <a class="brand" href="./" aria-label="hi!Thesis 首页">
      <span class="brand-copy"><strong class="wordmark">h<span class="wordmark-pair"><span class="wordmark-i">i</span><span class="wordmark-bang" aria-hidden="true">!</span></span>Thesis</strong><span>哈尔滨工业大学LaTeX学位论文模板</span></span>
    </a>
    <nav class="site-nav" aria-label="网站导航">
      <a class="active" href="#download-center" aria-current="page">模板下载</a>
      <a href="./DEV_CHANGELOG.md" target="_blank" rel="noopener">更新记录</a>
      <a href="https://github.com/hithesis/hithesis" target="_blank" rel="noopener">GitHub <span aria-hidden="true">↗</span></a>
      <a href="https://github.com/hithesis/hithesis/issues" target="_blank" rel="noopener">问题反馈 <span aria-hidden="true">↗</span></a>
    </nav>
    <button class="theme-toggle" id="theme-toggle" type="button" aria-label="外观：跟随系统">
      <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M12 3a9 9 0 0 1 0 18Z" fill="currentColor"/></svg>
      <span id="theme-label">自动</span>
    </button>
  </div>
</header>

<section class="hero" aria-labelledby="page-title">
  <div class="container hero-inner">
    <div class="hero-copy">
      <h1 id="page-title"><span>哈尔滨工业大学</span><span class="title-latex">LaTeX</span><span>学位论文模板</span></h1>
    </div>
    <a class="recruit-notice" href="https://dustincys.github.io/cn/2025/03/jobad/" target="_blank" rel="noopener">
      <span class="recruit-title">初砚硕课题组招生</span><span class="ad-label">广告</span><span aria-hidden="true">↗</span>
    </a>
  </div>
</section>

<main class="container download-center" id="download-center">
  <section class="version-panel" aria-labelledby="version-heading">
    <div class="version-intro">
      <h2 id="version-heading">选择版本</h2>
    </div>
    <div class="version-content">
      <div class="opts version-options" data-group="version" role="radiogroup" aria-labelledby="version-heading">
        <label class="opt version-card"><input type="radio" name="version" value="stable" checked><span class="version-card-title">稳定版</span><small id="stable-label">最新正式版</small></label>
        <label class="opt version-card"><input type="radio" name="version" value="dev"><span class="version-card-title">开发版</span><small id="dev-label">读取构建信息中…</small></label>
      </div>
      <details class="version-info" hidden>
        <summary>版本详情</summary>
        <div class="version-popover">
          <p id="version-status" aria-live="polite" hidden></p>
          <p id="version-details" hidden>
            <span id="build-date"></span>
            <a id="build-commit" target="_blank" rel="noopener"></a>
            <a id="build-run" target="_blank" rel="noopener">构建记录</a>
            <a id="build-release" target="_blank" rel="noopener">发布页面</a>
            <a id="build-report" target="_blank" rel="noopener">更新说明（PDF）</a>
            <a href="./DEV_CHANGELOG.md" target="_blank" rel="noopener">更新记录</a>
          </p>
        </div>
      </details>
    </div>
  </section>

  <div class="download-layout">
    <section class="panel selector-panel" aria-labelledby="selector-heading">
      <div class="panel-heading">
        <h2 id="selector-heading">选择模板</h2>
        <div class="selection-tools"><span>可多选</span><button class="text-button" id="clear" type="button">清空</button></div>
      </div>

      <div class="filter-row" role="group" aria-labelledby="language-heading">
        <div class="row-label"><h3 id="language-heading">语言</h3></div>
        <div class="opts" data-group="language">
          <label class="opt"><input type="checkbox" value="zh"><span>中文</span></label>
          <label class="opt"><input type="checkbox" value="en"><span>英文</span></label>
        </div>
      </div>

      <div class="filter-row" role="group" aria-labelledby="campus-heading">
        <div class="row-label"><h3 id="campus-heading">校区</h3></div>
        <div class="opts" data-group="campus">
          <label class="opt"><input type="checkbox" value="harbin"><span>哈尔滨</span></label>
          <label class="opt"><input type="checkbox" value="weihai"><span>威海</span></label>
          <label class="opt"><input type="checkbox" value="shenzhen"><span>深圳</span></label>
        </div>
      </div>

      <div class="filter-row" role="group" aria-labelledby="type-heading">
        <div class="row-label"><h3 id="type-heading">类型</h3></div>
        <div class="opts" data-group="type">
          <label class="opt"><input type="checkbox" value="doctor"><span>博士</span></label>
          <label class="opt"><input type="checkbox" value="master"><span>硕士</span></label>
          <label class="opt"><input type="checkbox" value="bachelor"><span>本科</span></label>
          <label class="opt"><input type="checkbox" value="postdoc"><span>博士后</span></label>
        </div>
      </div>

      <div class="filter-row" id="stage-panel" role="group" aria-labelledby="stage-heading">
        <div class="row-label"><h3 id="stage-heading">阶段</h3></div>
        <div class="opts" data-group="stage">
          <label class="opt"><input type="checkbox" value="opening"><span>开题</span></label>
          <label class="opt"><input type="checkbox" value="midterm"><span>中期</span></label>
          <label class="opt"><input type="checkbox" value="final"><span>终稿<span class="choice-note">（论文）</span></span></label>
        </div>
        <p class="selection-help" id="stage-hint" hidden></p>
      </div>
    </section>

    <aside class="panel preview" aria-labelledby="preview-heading">
      <div class="preview-heading"><h2 id="preview-heading">下载清单</h2><span class="count" id="count" aria-label="匹配模板数量">0</span></div>
      <p class="selection-summary" id="selection-summary" hidden></p>
      <p class="sr-only" id="selection-status" aria-live="polite">请选择模板。</p>
      <div class="empty-state" id="empty-state"><p>请选择模板。</p></div>
      <ul id="list" aria-label="匹配的模板文件"></ul>
      <div class="actions">
        <p class="action-summary" id="action-summary" aria-live="polite">已匹配 0 份模板 · 稳定版</p>
        <button class="primary" id="download" type="button" disabled><span aria-hidden="true">↓</span> 下载选中 <span class="button-count" id="download-count">0</span></button>
        <button class="secondary" id="download-all" type="button">下载全部</button>
      </div>
    </aside>
  </div>
</main>

<footer class="site-footer">
  <div class="container footer-inner">
    <a class="footer-brand wordmark" href="https://github.com/hithesis/hithesis" target="_blank" rel="noopener" aria-label="hi!Thesis GitHub">h<span class="wordmark-pair"><span class="wordmark-i">i</span><span class="wordmark-bang" aria-hidden="true">!</span></span>Thesis</a>
    <div class="footer-links">
      <button class="footer-link" id="contributors-open" type="button" aria-haspopup="dialog">贡献者</button>
    </div>
  </div>
</footer>

<dialog class="contributors-dialog" id="contributors-dialog" aria-labelledby="contributors-heading">
  <div class="dialog-heading">
    <h2 id="contributors-heading">贡献者</h2>
    <button class="dialog-close" id="contributors-close" type="button" aria-label="关闭贡献者名单">×</button>
  </div>
  <p class="dialog-note">按 GitHub 提交次数排序</p>
  <p id="contributors-status" role="status">正在读取名单…</p>
  <ul class="contributors-list" id="contributors-list" aria-label="GitHub 贡献者"></ul>
  <div class="dialog-footer"><a href="https://github.com/hithesis/hithesis/graphs/contributors" target="_blank" rel="noopener">完整贡献记录 ↗</a></div>
</dialog>

<script src="./script.js?v=campus-13" defer></script>
<script src="./contributors.js?v=campus-13" defer></script>
</body>
</html>
